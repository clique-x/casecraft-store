# Production stack for the whole platform on one VPS (Hostinger KVM 2 or any Ubuntu server with Docker):
# the storefront at https://$SITE_DOMAIN (www redirects to it) and the Medusa API and admin at https://$API_DOMAIN.
#
#   docker compose -f infra/prod/docker-compose.yml --env-file infra/prod/.env up -d --build
#
# Postgres and Redis are only reachable inside this Docker network. Caddy is the only thing on ports 80/443.
# The storefront is in the "web" profile: deploy.sh and first-run.sh start it once the store keys exist.
name: casecraft

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-medusa: &medusa
  build:
    context: ../..
    dockerfile: apps/backend/Dockerfile
  image: casecraft-backend:latest
  env_file: .env
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: casecraft
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/prod/.env}
      POSTGRES_DB: casecraft
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casecraft -d casecraft"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # API and admin. Applies database migrations before it starts, so a deploy never runs on an old schema.
  # sslmode=disable: Postgres is on this private Docker network; Medusa would otherwise try SSL in production.
  medusa-server:
    <<: *medusa
    environment:
      DATABASE_URL: postgres://casecraft:${POSTGRES_PASSWORD}@postgres:5432/casecraft?sslmode=disable
      REDIS_URL: redis://redis:6379
      MEDUSA_WORKER_MODE: server
    command: ["sh", "-c", "npx medusa db:migrate && exec npx medusa start"]
    # Loopback only: the storefront build reads the catalogue from here, and a host nginx (PROXY=nginx)
    # forwards api.<domain> to it. Not reachable from outside.
    ports:
      - "127.0.0.1:${MEDUSA_HOST_PORT:-9100}:9000"

  # Subscribers and scheduled jobs (storefront refresh, emails later). Starts after the server is healthy,
  # so migrations have run.
  medusa-worker:
    <<: *medusa
    environment:
      DATABASE_URL: postgres://casecraft:${POSTGRES_PASSWORD}@postgres:5432/casecraft?sslmode=disable
      REDIS_URL: redis://redis:6379
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"
    depends_on:
      medusa-server:
        condition: service_healthy
    healthcheck:
      disable: true

  # Next.js storefront. deploy.sh builds the image (docker build --network host, so the build can read the
  # live catalogue from Medusa on 127.0.0.1:9000 and prerender the pages); at runtime it talks to Medusa over
  # this private network. Browsers never call Medusa directly.
  storefront:
    profiles: ["web"]
    image: casecraft-storefront:latest
    pull_policy: never
    # Loopback only, for a host nginx (PROXY=nginx). Caddy reaches it over the Docker network instead.
    ports:
      - "127.0.0.1:${STOREFRONT_HOST_PORT:-3100}:3000"
    restart: unless-stopped
    logging: *logging
    environment:
      MEDUSA_BACKEND_URL: http://medusa-server:9000
      MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY:-}
      MEDUSA_REGION_ID: ${MEDUSA_REGION_ID:-}
      REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET:?set STOREFRONT_REVALIDATE_SECRET in infra/prod/.env}
    depends_on:
      medusa-server:
        condition: service_healthy

  # HTTPS for the site and API domains, with automatic Let's Encrypt certificates. Not started when the
  # server already runs nginx on 80/443 (PROXY=nginx in .env, see use-host-nginx.sh).
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in infra/prod/.env}
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in infra/prod/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      medusa-server:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
