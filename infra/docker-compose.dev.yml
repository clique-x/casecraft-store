# Local Postgres and Redis for the Medusa backend.
#   docker compose -f infra/docker-compose.dev.yml up -d
# Matches DATABASE_URL and REDIS_URL in apps/backend/.env.example.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: casecraft
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres-data:
